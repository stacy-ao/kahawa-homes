<html lang="en">

  <style>
    /* ══════════════════════════════════════════
       DESIGN TOKENS
    ══════════════════════════════════════════ */
    :root {
      --serif:   'Playfair Display', Georgia, serif;
      --sans:    'Inter', system-ui, sans-serif;
      --cream:        #f7f3ec;
      --cream-dark:   #ede6d6;
      --espresso:     #1e120a;
      --espresso-mid: #4a2c17;
      --espresso-lt:  #7a5c3e;
      --gold:         #c9a96e;
      --gold-lt:      #e8d5b0;
      --white:        #ffffff;
      --border:       #e8e0d0;
      --muted:        #6b5744;
      --green:        #25d366; /* WhatsApp */
      --shadow-xs: 0 1px 4px rgba(30,18,10,.08);
      --shadow-sm: 0 2px 12px rgba(30,18,10,.10);
      --shadow-md: 0 6px 24px rgba(30,18,10,.14);
      --shadow-lg: 0 16px 48px rgba(30,18,10,.18);
      --r: .75rem;
      --r-pill: 50px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { font-family: var(--sans); background: var(--cream); color: var(--espresso); line-height: 1.65; -webkit-font-smoothing: antialiased; }
    button { font-family: inherit; cursor: pointer; }
    img { display: block; max-width: 100%; }
    input, select { font-family: inherit; }

    /* ══════════════════════════════════════════
       SCROLLBAR (webkit)
    ══════════════════════════════════════════ */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--cream); }
    ::-webkit-scrollbar-thumb { background: var(--gold-lt); border-radius: 99px; }

    /* ══════════════════════════════════════════
       NAV
    ══════════════════════════════════════════ */
    .nav {
      position: sticky; top: 0; z-index: 200;
      background: var(--white);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      padding: .9rem 2rem;
      gap: 1rem;
    }
    .nav-logo {
      font-family: var(--serif);
      font-size: 1.3rem; font-weight: 700;
      color: var(--espresso);
      white-space: nowrap;
      cursor: pointer;
      user-select: none;
    }
    .nav-logo span { color: var(--gold); }
    .nav-search {
      display: flex; align-items: center;
      background: var(--white);
      border: 1.5px solid var(--border);
      border-radius: var(--r-pill);
      overflow: hidden;
      box-shadow: var(--shadow-xs);
      flex: 1; max-width: 520px;
    }
    .nav-search-pill {
      display: flex; align-items: center;
      padding: .55rem 1.1rem;
      gap: .5rem;
      cursor: pointer;
      font-size: .82rem; font-weight: 500;
      border-right: 1px solid var(--border);
      color: var(--espresso);
      transition: background .15s;
      white-space: nowrap;
    }
    .nav-search-pill:last-of-type { border-right: none; }
    .nav-search-pill:hover { background: var(--cream); }
    .nav-search-pill svg { color: var(--espresso-lt); flex-shrink: 0; }
    .nav-search-btn {
      margin: .35rem .35rem .35rem 0;
      width: 36px; height: 36px; border-radius: 50%;
      background: var(--espresso);
      border: none; color: white;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: background .2s;
    }
    .nav-search-btn:hover { background: var(--espresso-mid); }
    .nav-right { display: flex; align-items: center; gap: .8rem; }
    .nav-link {
      font-size: .85rem; font-weight: 500; color: var(--espresso);
      background: none; border: none; padding: .4rem .8rem; border-radius: var(--r-pill);
      transition: background .15s;
      white-space: nowrap;
    }
    .nav-link:hover { background: var(--cream); }
    .nav-avatar {
      width: 36px; height: 36px; border-radius: 50%;
      background: var(--espresso); display: flex; align-items: center; justify-content: center;
      border: none;
    }
    .nav-avatar svg { color: white; }

    /* ══════════════════════════════════════════
       FILTER CHIPS
    ══════════════════════════════════════════ */
    .filter-bar {
      background: var(--white);
      border-bottom: 1px solid var(--border);
      padding: .75rem 2rem;
      display: flex; gap: .6rem;
      overflow-x: auto; scrollbar-width: none;
    }
    .filter-bar::-webkit-scrollbar { display: none; }
    .chip {
      flex-shrink: 0;
      padding: .45rem 1.1rem;
      border-radius: var(--r-pill);
      border: 1.5px solid var(--border);
      background: var(--white);
      font-size: .8rem; font-weight: 500;
      color: var(--espresso);
      transition: all .18s;
    }
    .chip:hover { border-color: var(--espresso); }
    .chip.active { background: var(--espresso); border-color: var(--espresso); color: var(--white); }

    /* ══════════════════════════════════════════
       HOMEPAGE — PROPERTY GRID
    ══════════════════════════════════════════ */
    .home-wrap { max-width: 1280px; margin: 0 auto; padding: 2rem; }
    .section-heading {
      font-family: var(--serif);
      font-size: 1.4rem; font-weight: 700;
      margin-bottom: 1.5rem;
      display: flex; align-items: center; justify-content: space-between;
    }
    .prop-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.6rem;
    }

    /* ── Card ── */
    .prop-card {
      border-radius: var(--r);
      overflow: visible;
      cursor: pointer;
      position: relative;
      transition: transform .25s;
    }
    .prop-card:hover { transform: translateY(-3px); }
    .prop-card:hover .card-img img { transform: scale(1.04); }
    .card-img {
      position: relative;
      border-radius: var(--r);
      overflow: hidden;
      aspect-ratio: 4/3;
      background: var(--cream-dark);
    }
    .card-img img { width: 100%; height: 100%; object-fit: cover; transition: transform .4s; }
    .card-badge {
      position: absolute; top: .7rem; left: .7rem;
      background: var(--white);
      font-size: .72rem; font-weight: 600;
      padding: .28rem .7rem; border-radius: var(--r-pill);
      box-shadow: var(--shadow-xs);
      display: flex; align-items: center; gap: .3rem;
    }
    .card-badge::before { content: '🏡'; font-size: .7rem; }
    .card-heart {
      position: absolute; top: .7rem; right: .7rem;
      width: 32px; height: 32px; border-radius: 50%;
      background: rgba(255,255,255,.85); border: none;
      display: flex; align-items: center; justify-content: center;
      font-size: 1rem; transition: transform .2s, background .2s;
      box-shadow: var(--shadow-xs);
    }
    .card-heart:hover { transform: scale(1.15); background: white; }
    .card-body { padding: .85rem .1rem .4rem; }
    .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: .5rem; }
    .card-name { font-weight: 600; font-size: .95rem; color: var(--espresso); }
    .card-rating { display: flex; align-items: center; gap: .25rem; font-size: .82rem; font-weight: 500; flex-shrink: 0; }
    .card-rating svg { color: var(--espresso); }
    .card-location { font-size: .82rem; color: var(--muted); margin: .1rem 0; }
    .card-price { font-size: .9rem; margin-top: .45rem; }
    .card-price strong { font-weight: 600; }
    .card-price span { color: var(--muted); font-weight: 400; }

    /* ══════════════════════════════════════════
       DETAIL PAGE
    ══════════════════════════════════════════ */
    .detail-wrap { max-width: 1100px; margin: 0 auto; padding: 1.5rem 2rem 4rem; }
    .detail-back {
      display: inline-flex; align-items: center; gap: .4rem;
      background: none; border: none;
      font-size: .9rem; font-weight: 500;
      color: var(--espresso);
      padding: .5rem 0; margin-bottom: 1.2rem;
      text-decoration: underline; text-underline-offset: 3px;
      transition: color .2s;
    }
    .detail-back:hover { color: var(--gold); }
    .detail-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; margin-bottom: 1.2rem; flex-wrap: wrap; }
    .detail-title { font-family: var(--serif); font-size: clamp(1.5rem, 3vw, 2rem); font-weight: 700; }
    .detail-actions { display: flex; gap: .8rem; }
    .detail-action-btn {
      display: flex; align-items: center; gap: .4rem;
      background: none; border: none; font-size: .85rem; font-weight: 500;
      padding: .4rem .8rem; border-radius: var(--r);
      text-decoration: underline; text-underline-offset: 3px;
      transition: background .15s;
    }
    .detail-action-btn:hover { background: var(--cream); }

    /* ── Photo Mosaic ── */
    .mosaic {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: auto auto;
      gap: .5rem;
      border-radius: var(--r);
      overflow: hidden;
      margin-bottom: 2rem;
      max-height: 480px;
    }
    .mosaic-main { grid-row: 1 / 3; }
    .mosaic img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .mosaic-main img { height: 480px; }
    .mosaic-side { display: grid; grid-template-rows: 1fr 1fr; gap: .5rem; }
    .mosaic-side img { height: 234px; }
    .mosaic-more-wrap { position: relative; }
    .mosaic-more-wrap img { height: 234px; }
    .mosaic-more-btn {
      position: absolute; bottom: .9rem; right: .9rem;
      background: var(--white); border: 1.5px solid var(--espresso);
      border-radius: .45rem; padding: .45rem .9rem;
      font-size: .8rem; font-weight: 600;
      display: flex; align-items: center; gap: .4rem;
      transition: background .2s;
    }
    .mosaic-more-btn:hover { background: var(--cream); }

    /* ── Detail Body ── */
    .detail-body {
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 3.5rem;
      align-items: start;
    }
    @media (max-width: 860px) {
      .detail-body { grid-template-columns: 1fr; }
      .booking-sticky { position: static !important; }
    }

    .detail-meta { font-size: 1rem; color: var(--muted); margin-bottom: 1.2rem; }
    .detail-badges {
      display: flex; gap: .8rem; flex-wrap: wrap;
      margin-bottom: 1.5rem;
    }
    .detail-badge {
      display: flex; align-items: center; gap: .5rem;
      border: 1.5px solid var(--border); border-radius: var(--r);
      padding: .65rem 1rem; font-size: .82rem;
    }
    .detail-badge-icon { font-size: 1.3rem; }
    .detail-badge-text strong { display: block; font-size: .82rem; }
    .detail-badge-text span { font-size: .75rem; color: var(--muted); }

    .divider { border: none; border-top: 1px solid var(--border); margin: 1.5rem 0; }

    .host-row { display: flex; align-items: center; gap: 1rem; margin-bottom: 1.5rem; }
    .host-avatar {
      width: 48px; height: 48px; border-radius: 50%;
      background: var(--espresso);
      display: flex; align-items: center; justify-content: center;
      font-family: var(--serif); font-size: 1.2rem; color: white; font-weight: 700;
      flex-shrink: 0;
    }
    .host-info strong { font-size: .95rem; display: block; }
    .host-info span { font-size: .8rem; color: var(--muted); }

    .detail-desc { font-size: .95rem; line-height: 1.75; color: var(--espresso-mid); }

    .amenities-grid-detail {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 1rem; margin-top: 1rem;
    }
    .amenity-row { display: flex; align-items: center; gap: .75rem; font-size: .9rem; }
    .amenity-row svg { flex-shrink: 0; color: var(--espresso-mid); }

    .rules-list { list-style: none; display: flex; flex-direction: column; gap: .6rem; margin-top: .8rem; }
    .rules-list li { display: flex; align-items: center; gap: .6rem; font-size: .9rem; color: var(--espresso-mid); }

    /* ── Booking Card (sticky) ── */
    .booking-sticky {
      position: sticky;
      top: 90px;
    }
    .booking-card {
      background: var(--white);
      border: 1.5px solid var(--border);
      border-radius: var(--r);
      padding: 1.6rem;
      box-shadow: var(--shadow-md);
    }
    .booking-price { font-size: 1.3rem; font-weight: 700; margin-bottom: 1.2rem; }
    .booking-price span { font-size: .9rem; font-weight: 400; color: var(--muted); }
    .date-row {
      display: grid; grid-template-columns: 1fr 1fr;
      border: 1.5px solid var(--border); border-radius: var(--r);
      overflow: hidden; margin-bottom: .8rem;
    }
    .date-field {
      padding: .7rem .9rem;
      border: none; outline: none;
      font-family: inherit; font-size: .82rem;
      background: var(--white);
      cursor: pointer;
    }
    .date-field:first-child { border-right: 1px solid var(--border); }
    .date-field:focus { background: var(--cream); }
    .date-label { font-size: .68rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; display: block; margin-bottom: .2rem; }
    .guests-field {
      width: 100%; padding: .75rem .9rem;
      border: 1.5px solid var(--border); border-radius: var(--r);
      font-family: inherit; font-size: .9rem;
      background: var(--white); cursor: pointer;
      margin-bottom: 1rem; appearance: none;
    }
    .name-field {
      width: 100%; padding: .75rem .9rem;
      border: 1.5px solid var(--border); border-radius: var(--r);
      font-family: inherit; font-size: .9rem;
      background: var(--white); margin-bottom: 1rem;
    }
    .name-field:focus, .guests-field:focus { outline: none; border-color: var(--gold); }
    .wa-btn {
      width: 100%; padding: .95rem;
      background: var(--green);
      border: none; border-radius: var(--r);
      color: white; font-weight: 700; font-size: 1rem;
      display: flex; align-items: center; justify-content: center; gap: .6rem;
      transition: background .2s, transform .15s;
      margin-bottom: .8rem;
    }
    .wa-btn:hover { background: #1ebe5d; transform: translateY(-1px); }
    .wa-btn svg { flex-shrink: 0; }
    .booking-note { text-align: center; font-size: .78rem; color: var(--muted); }
    .booking-note a { color: var(--espresso); font-weight: 500; text-decoration: underline; }
    .booking-breakdown { border-top: 1px solid var(--border); margin-top: 1rem; padding-top: 1rem; }
    .booking-breakdown-row {
      display: flex; justify-content: space-between;
      font-size: .88rem; padding: .3rem 0;
      color: var(--espresso-mid);
    }
    .booking-breakdown-row.total {
      font-weight: 700; font-size: .95rem;
      color: var(--espresso); border-top: 1px solid var(--border);
      margin-top: .5rem; padding-top: .7rem;
    }

    /* ══════════════════════════════════════════
       FOOTER
    ══════════════════════════════════════════ */
    footer {
      background: var(--espresso); color: rgba(255,255,255,.75);
      padding: 3rem 2rem 2rem; text-align: center;
    }
    .footer-logo { font-family: var(--serif); font-size: 1.4rem; color: white; margin-bottom: .3rem; }
    .footer-logo span { color: var(--gold); }
    .footer-sub { font-size: .78rem; letter-spacing: .18em; text-transform: uppercase; color: var(--gold); margin-bottom: 1.8rem; }
    .footer-links { display: flex; flex-wrap: wrap; justify-content: center; gap: 1.2rem; margin-bottom: 1.5rem; }
    .footer-links a {
      color: rgba(255,255,255,.75); font-size: .85rem;
      display: flex; align-items: center; gap: .4rem;
      transition: color .2s;
    }
    .footer-links a:hover { color: var(--gold); }
    .footer-socials { display: flex; justify-content: center; gap: 1rem; margin-bottom: 1.8rem; }
    .footer-socials a {
      width: 38px; height: 38px; border-radius: 50%;
      border: 1.5px solid rgba(255,255,255,.2);
      display: flex; align-items: center; justify-content: center;
      transition: border-color .2s, background .2s;
    }
    .footer-socials a:hover { background: var(--gold); border-color: var(--gold); }
    .footer-socials svg { width: 17px; height: 17px; fill: white; }
    .footer-copy { font-size: .75rem; opacity: .4; }

    /* ══════════════════════════════════════════
       RESPONSIVE
    ══════════════════════════════════════════ */
    @media (max-width: 680px) {
      .home-wrap { padding: 1.2rem; }
      .detail-wrap { padding: 1rem 1.2rem 3rem; }
      .nav { padding: .8rem 1.2rem; }
      .nav-search { display: none; }
      .filter-bar { padding: .6rem 1.2rem; }
      .mosaic { grid-template-columns: 1fr; max-height: none; }
      .mosaic-main img { height: 260px; }
      .mosaic-side { display: none; }
      .amenities-grid-detail { grid-template-columns: 1fr; }
    }

    /* ══════════════════════════════════════════
       UTILITY
    ══════════════════════════════════════════ */
    .fade-in { animation: fadeIn .3s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>

/* ────────────────────────────────────────────
   PROPERTY CARD
──────────────────────────────────────────── */
function PropertyCard({ prop, onClick }) {
  const [saved, setSaved] = useState(false);
  return h('div', { className: 'prop-card', onClick },
    h('div', { className: 'card-img' },
      h('img', { src: prop.images[0], alt: prop.name, loading: 'lazy' }),
      h('div', { className: 'card-badge' }, prop.badge),
      h('button', {
        className: 'card-heart',
        onClick: e => { e.stopPropagation(); setSaved(!saved); },
        'aria-label': saved ? 'Unsave' : 'Save',
      }, saved ? '❤️' : '🤍')
    ),
    h('div', { className: 'card-body' },
      h('div', { className: 'card-top' },
        h('span', { className: 'card-name' }, prop.name),
        h('span', { className: 'card-rating' }, h(IconStar), prop.rating)
      ),
      h('p', { className: 'card-location' }, prop.location),
      h('p', { className: 'card-price' },
        h('strong', null, `KSh ${prop.pricePerNight.toLocaleString()}`),
        h('span', null, ' / night')
      )
    )
  );
}

/* ────────────────────────────────────────────
   HOME VIEW
──────────────────────────────────────────── */
function HomeView({ onSelect, filter }) {
  const filtered = filter === 'All locations'
    ? properties
    : properties.filter(prop => prop.location.startsWith(`${filter},`) || prop.location === filter);
  return h('div', { className: 'home-wrap fade-in' },
    h('div', { className: 'section-heading' },
      `${filter === 'All locations' ? 'Popular homes' : `Homes in ${filter}`} →`
    ),
    h('div', { className: 'prop-grid' },
      filtered.map(p => h(PropertyCard, { key: p.id, prop: p, onClick: () => onSelect(p) }))
    )
  );
}

/* ────────────────────────────────────────────
   DETAIL VIEW
──────────────────────────────────────────── */
function DetailView({ prop, onBack }) {
  const [checkIn, setCheckIn]   = useState('');
  const [checkOut, setCheckOut] = useState('');
  const [guests, setGuests]     = useState(1);
  const [name, setName]         = useState('');

  // Calculate nights + total
  const nights = checkIn && checkOut
    ? Math.max(0, Math.round((new Date(checkOut) - new Date(checkIn)) / 86400000))
    : 0;
  const total = nights * prop.pricePerNight;

  const handleBook = () => {
    if (!name || !checkIn || !checkOut) { alert('Please fill in your name and dates.'); return; }
    const msg = `Hello! I would like to book *${prop.name}* in *${prop.location}* from *${checkIn}* to *${checkOut}* for *${guests} guest(s)*. My name is *${name}*. Please confirm availability. Thank you! 🙏`;
    window.open(`https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(msg)}`, '_blank');
  };

  return h('div', { className: 'detail-wrap fade-in' },
    // Back
    h('button', { className: 'detail-back', onClick: onBack }, h(IconBack), ' Back to listings'),

    // Header
    h('div', { className: 'detail-header' },
      h('h1', { className: 'detail-title' }, prop.name),
      h('div', { className: 'detail-actions' },
        h('button', { className: 'detail-action-btn' }, h(IconShare), ' Share'),
        h('button', { className: 'detail-action-btn' }, h(IconHeart), ' Save')
      )
    ),

    // Mosaic
    h('div', { className: 'mosaic' },
      h('div', { className: 'mosaic-main' },
        h('img', { src: prop.images[0], alt: prop.name })
      ),
      h('div', { className: 'mosaic-side' },
        h('img', { src: prop.images[1], alt: '' }),
        h('div', { className: 'mosaic-more-wrap' },
          h('img', { src: prop.images[2], alt: '' }),
          h('button', { className: 'mosaic-more-btn' }, h(IconGrid), ` Show all photos`)
        )
      )
    ),

    // Body
    h('div', { className: 'detail-body' },

      // ── LEFT ──
      h('div', null,
        h('p', { style: { fontWeight: 600, fontSize: '1.05rem', marginBottom: '.3rem' } }, prop.type, ' · ', prop.location),
        h('p', { className: 'detail-meta' },
          `${prop.guests} guests · ${prop.bedrooms} bedroom${prop.bedrooms>1?'s':''} · ${prop.beds} bed${prop.beds>1?'s':''} · ${prop.baths} bath${prop.baths>1?'s':''}`
        ),

        // Rating badge
        h('div', { className: 'detail-badges' },
          h('div', { className: 'detail-badge' },
            h('div', { className: 'detail-badge-icon' }, '🏅'),
            h('div', { className: 'detail-badge-text' },
              h('strong', null, 'Guest Favourite'),
              h('span', null, 'One of the most loved homes')
            )
          ),
          h('div', { className: 'detail-badge' },
            h('div', { className: 'detail-badge-icon' }, '⭐'),
            h('div', { className: 'detail-badge-text' },
              h('strong', null, prop.rating),
              h('span', null, `${prop.reviews} reviews`)
            )
          )
        ),

        h('hr', { className: 'divider' }),

        // Host
        h('div', { className: 'host-row' },
          h('div', { className: 'host-avatar' }, prop.host.name[0]),
          h('div', { className: 'host-info' },
            h('strong', null, `Hosted by ${prop.host.name}`),
            h('span', null, `${prop.host.months} months hosting`)
          )
        ),

        h('hr', { className: 'divider' }),

        // Description
        h('p', { className: 'detail-desc' },
          ...prop.description.split('\n').flatMap((line, i, arr) =>
            i < arr.length - 1 ? [line, h('br', { key: i }), h('br', { key: `s${i}` })] : [line]
          )
        ),

        h('hr', { className: 'divider' }),

        // Amenities
        h('h3', { style: { fontFamily: 'var(--serif)', fontSize: '1.25rem', marginBottom: '1rem' } }, 'What this place offers'),
        h('div', { className: 'amenities-grid-detail' },
          prop.amenities.map((a, i) => {
            const Icon = getAmenityIcon(a);
            return h('div', { key: i, className: 'amenity-row' }, h(Icon), a);
          })
        ),

        h('hr', { className: 'divider' }),

        // Rules
        h('h3', { style: { fontFamily: 'var(--serif)', fontSize: '1.25rem', marginBottom: '.5rem' } }, 'House rules'),
        h('ul', { className: 'rules-list' },
          prop.rules.map((r, i) => h('li', { key: i },
            h('span', { style: { fontSize: '1rem' } }, '✓'), r
          ))
        )
      ),

      // ── RIGHT (sticky booking card) ──
      h('div', { className: 'booking-sticky' },
        h('div', { className: 'booking-card' },
          h('p', { className: 'booking-price' },
            `KSh ${prop.pricePerNight.toLocaleString()}`, h('span', null, ' / night')
          ),

          // Name
          h('label', { style: { fontSize: '.72rem', fontWeight: 700, letterSpacing: '.08em', textTransform: 'uppercase', display: 'block', marginBottom: '.4rem' } }, 'Your Name'),
          h('input', {
            type: 'text', className: 'name-field',
            placeholder: 'e.g. Nelly Arunga',
            value: name, onChange: e => setName(e.target.value)
          }),

          // Dates
          h('div', { style: { fontSize: '.72rem', fontWeight: 700, letterSpacing: '.08em', textTransform: 'uppercase', marginBottom: '.4rem' } }, 'Dates'),
          h('div', { className: 'date-row' },
            h('div', { style: { borderRight: '1px solid var(--border)', padding: 0 } },
              h('label', { className: 'date-label', style: { padding: '.7rem .9rem .1rem' } }, 'Check-in'),
              h('input', { className: 'date-field', type: 'date', value: checkIn, onChange: e => setCheckIn(e.target.value), style: { display: 'block' } })
            ),
            h('div', null,
              h('label', { className: 'date-label', style: { padding: '.7rem .9rem .1rem' } }, 'Check-out'),
              h('input', { className: 'date-field', type: 'date', value: checkOut, onChange: e => setCheckOut(e.target.value), style: { display: 'block' } })
            )
          ),

          // Guests
          h('label', { style: { fontSize: '.72rem', fontWeight: 700, letterSpacing: '.08em', textTransform: 'uppercase', display: 'block', margin: '.8rem 0 .4rem' } }, 'Guests'),
          h('select', { className: 'guests-field', value: guests, onChange: e => setGuests(Number(e.target.value)) },
            [...Array(prop.guests)].map((_, i) => h('option', { key: i+1, value: i+1 }, `${i+1} guest${i+1 > 1 ? 's' : ''}`))
          ),

          // WhatsApp button
          h('button', { className: 'wa-btn', onClick: handleBook },
            h(IconWA), 'Reserve via WhatsApp'
          ),
          h('p', { className: 'booking-note' }, 'You won\'t be charged yet — we\'ll confirm via WhatsApp first.'),

          // Price breakdown
          nights > 0 && h('div', { className: 'booking-breakdown' },
            h('div', { className: 'booking-breakdown-row' },
              h('span', null, `KSh ${prop.pricePerNight.toLocaleString()} × ${nights} night${nights > 1 ? 's' : ''}`),
              h('span', null, `KSh ${total.toLocaleString()}`)
            ),
            h('div', { className: 'booking-breakdown-row' },
              h('span', null, 'Service fee'),
              h('span', null, 'KSh 0')
            ),
            h('div', { className: 'booking-breakdown-row total' },
              h('span', null, 'Total'),
              h('span', null, `KSh ${total.toLocaleString()}`)
            )
          )
        )
      )
    )
  );
}

/* ────────────────────────────────────────────
   APP (router)
──────────────────────────────────────────── */
function App() {
  const [selected, setSelected] = useState(null);
  const [filter, setFilter]     = useState('All');

  const goHome = () => { setSelected(null); window.scrollTo(0,0); };
  const goDetail = (p) => { setSelected(p); window.scrollTo(0,0); };

  return h(React.Fragment, null,
    h(Nav, { onLogoClick: goHome }),
    !selected && h(FilterBar, { active: filter, onChange: setFilter }),
    selected
      ? h(DetailView, { prop: selected, onBack: goHome })
      : h(HomeView, { onSelect: goDetail, filter }),
    h(Footer, null)
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App, null));
