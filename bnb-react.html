<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Kahawa Homes – Boutique B&B</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2324140f'/%3E%3Ctext x='32' y='42' text-anchor='middle' font-family='Georgia' font-size='25' fill='%23d2a45b'%3EKH%3C/text%3E%3C/svg%3E" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Kahawa Homes – Luxury Bed & Breakfast in Kenya. Browse and book directly via WhatsApp.">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    /* ══════════════════════════════════════════
       DESIGN TOKENS
    ══════════════════════════════════════════ */
    :root {
      --serif:   'Playfair Display', Georgia, serif;
      --sans:    'Inter', system-ui, sans-serif;
      --cream:        #f7f3ec;
      --cream-dark:   #ede6d6;
      --espresso:     #1e120a;
      --espresso-mid: #4a2c17;
      --espresso-lt:  #7a5c3e;
      --gold:         #c9a96e;
      --gold-lt:      #e8d5b0;
      --white:        #ffffff;
      --border:       #e8e0d0;
      --muted:        #6b5744;
      --green:        #25d366; /* WhatsApp */
      --shadow-xs: 0 1px 4px rgba(30,18,10,.08);
      --shadow-sm: 0 2px 12px rgba(30,18,10,.10);
      --shadow-md: 0 6px 24px rgba(30,18,10,.14);
      --shadow-lg: 0 16px 48px rgba(30,18,10,.18);
      --r: .75rem;
      --r-pill: 50px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { font-family: var(--sans); background: #e8e0d2; color: var(--espresso); line-height: 1.65; -webkit-font-smoothing: antialiased; }
    .site-shell { width: min(100%, 1180px); min-height: 100vh; margin: 0 auto; background: var(--cream); box-shadow: 0 0 40px rgba(30,18,10,.12); }
    button { font-family: inherit; cursor: pointer; }
    img { display: block; max-width: 100%; }
    input, select { font-family: inherit; }

    /* ══════════════════════════════════════════
       SCROLLBAR (webkit)
    ══════════════════════════════════════════ */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--cream); }
    ::-webkit-scrollbar-thumb { background: var(--gold-lt); border-radius: 99px; }

    /* ══════════════════════════════════════════
       NAV
    ══════════════════════════════════════════ */
    .nav {
      position: sticky; top: 0; z-index: 200;
      background: var(--white);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      padding: .9rem 2rem;
      gap: 1rem;
    }
    .nav-logo {
      font-family: var(--serif);
      font-size: 1.3rem; font-weight: 700;
      color: var(--espresso);
      white-space: nowrap;
      cursor: pointer;
      user-select: none;
      border: 0;
      background: transparent;
      padding: 0;
    }
    .nav-logo span { color: var(--gold); }
    .nav-search {
      display: flex; align-items: center;
      background: var(--white);
      border: 1.5px solid var(--border);
      border-radius: var(--r-pill);
      overflow: hidden;
      box-shadow: var(--shadow-xs);
      flex: 1; max-width: 520px;
    }
    .nav-search-pill {
      display: flex; align-items: center;
      padding: .55rem 1.1rem;
      gap: .5rem;
      cursor: pointer;
      font-size: .82rem; font-weight: 500;
      border-right: 1px solid var(--border);
      color: var(--espresso);
      transition: background .15s;
      white-space: nowrap;
    }
    .nav-search-pill:last-of-type { border-right: none; }
    .nav-search-pill:hover { background: var(--cream); }
    .nav-search-pill svg { color: var(--espresso-lt); flex-shrink: 0; }
    .nav-search-input {
      flex: 1;
      min-width: 0;
      padding: .75rem 1rem;
      border: none;
      outline: none;
      background: transparent;
      color: var(--espresso);
      font: inherit;
    }
    .nav-search-input::placeholder { color: var(--espresso); opacity: 1; }
    .nav-search-btn {
      margin: .35rem .35rem .35rem 0;
      width: 36px; height: 36px; border-radius: 50%;
      background: var(--espresso);
      border: none; color: white;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: background .2s;
    }
    .nav-search-btn:hover { background: var(--espresso-mid); }
    .nav-right { display: flex; align-items: center; gap: .8rem; }
    .nav-link {
      font-size: .85rem; font-weight: 500; color: var(--espresso);
      background: none; border: none; padding: .4rem .8rem; border-radius: var(--r-pill);
      transition: background .15s;
      white-space: nowrap;
    }
    .nav-link:hover { background: var(--cream); }
    .nav-avatar {
      width: 36px; height: 36px; border-radius: 50%;
      background: var(--espresso); display: flex; align-items: center; justify-content: center;
      border: none;
    }
    .nav-avatar svg { color: white; }
    .profile-modal { position: fixed; inset: 0; z-index: 50; background: rgba(20,14,11,.42); display: grid; place-items: center; padding: 1rem; }
    .profile-sheet { width: min(100%, 380px); background: var(--cream); border: 1px solid var(--border); border-radius: 1.25rem; padding: 1.4rem; box-shadow: var(--shadow-lg); }
    .profile-sheet h2 { font-family: var(--serif); margin-bottom: .35rem; }
    .profile-sheet p { color: var(--muted); font-size: .85rem; margin-bottom: 1rem; }
    .profile-input { width: 100%; border: 1px solid var(--border); border-radius: 9999px; background: var(--white); padding: .8rem 1rem; font: inherit; outline: none; }
    .profile-input:focus { border-color: var(--gold); }
    .profile-actions { display: flex; justify-content: flex-end; gap: .6rem; margin-top: 1rem; }
    .profile-cancel { border: 1px solid var(--border); background: var(--white); border-radius: 9999px; padding: .7rem 1rem; }

    /* ══════════════════════════════════════════
       FILTER CHIPS
    ══════════════════════════════════════════ */
    .filter-bar {
      background: var(--white);
      border-bottom: 1px solid var(--border);
      padding: .75rem 2rem;
      display: flex; gap: .6rem;
      overflow-x: auto; scrollbar-width: none;
    }
    .filter-bar::-webkit-scrollbar { display: none; }
    .chip {
      flex-shrink: 0;
      padding: .45rem 1.1rem;
      border-radius: var(--r-pill);
      border: 1.5px solid var(--border);
      background: var(--white);
      font-size: .8rem; font-weight: 500;
      color: var(--espresso);
      transition: all .18s;
    }
    .chip:hover { border-color: var(--espresso); }
    .chip.active { background: var(--espresso); border-color: var(--espresso); color: var(--white); }

    /* ══════════════════════════════════════════
       HOMEPAGE — PROPERTY GRID
    ══════════════════════════════════════════ */
    .home-wrap { max-width: 980px; margin: 0 auto; padding: 1.6rem 2rem 5rem; }
    .section-heading {
      font-family: var(--serif);
      font-size: 1.4rem; font-weight: 700;
      margin-bottom: 1.5rem;
      display: flex; align-items: center; justify-content: space-between;
    }
    .prop-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 1.6rem;
    }

    /* ── Card ── */
    .prop-card {
      border-radius: var(--r);
      overflow: visible;
      cursor: pointer;
      position: relative;
      transition: transform .25s;
    }
    .prop-card:hover { transform: translateY(-3px); }
    .prop-card:hover .card-img img { transform: scale(1.04); }
    .card-img {
      position: relative;
      border-radius: var(--r);
      overflow: hidden;
      aspect-ratio: 4/3;
      background: var(--cream-dark);
    }
    .card-img img { width: 100%; height: 100%; object-fit: cover; transition: transform .4s; }
    .card-badge {
      position: absolute; top: .7rem; left: .7rem;
      background: var(--white);
      font-size: .72rem; font-weight: 600;
      padding: .28rem .7rem; border-radius: var(--r-pill);
      box-shadow: var(--shadow-xs);
      display: flex; align-items: center; gap: .3rem;
    }
    .card-heart {
      position: absolute; top: .7rem; right: .7rem;
      width: 32px; height: 32px; border-radius: 50%;
      background: rgba(255,255,255,.85); border: none;
      display: flex; align-items: center; justify-content: center;
      font-size: 1rem; transition: transform .2s, background .2s;
      box-shadow: var(--shadow-xs);
    }
    .card-heart:hover { transform: scale(1.15); background: white; }
    .card-heart.saved { background: var(--gold-lt); color: var(--espresso); }
    .card-body { padding: .85rem .1rem .4rem; }
    .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: .5rem; }
    .card-name { font-weight: 600; font-size: .95rem; color: var(--espresso); }
    .card-rating { display: flex; align-items: center; gap: .25rem; font-size: .82rem; font-weight: 500; flex-shrink: 0; }
    .card-rating svg { color: var(--espresso); }
    .card-location { font-size: .82rem; color: var(--muted); margin: .1rem 0; }
    .card-price { font-size: .9rem; margin-top: .45rem; }
    .card-price strong { font-weight: 600; }
    .card-price span { color: var(--muted); font-weight: 400; }
    .card-tags { display: flex; gap: .35rem; flex-wrap: wrap; margin-top: .55rem; }
    .card-tag { color: var(--muted); background: var(--cream-dark); border-radius: 9999px; padding: .22rem .5rem; font-size: .65rem; }

    /* ══════════════════════════════════════════
       DETAIL PAGE
    ══════════════════════════════════════════ */
    .detail-wrap { max-width: 1100px; margin: 0 auto; padding: 1.5rem 2rem 4rem; }
    .detail-back {
      display: inline-flex; align-items: center; gap: .4rem;
      background: none; border: none;
      font-size: .9rem; font-weight: 500;
      color: var(--espresso);
      padding: .5rem 0; margin-bottom: 1.2rem;
      text-decoration: underline; text-underline-offset: 3px;
      transition: color .2s;
    }
    .detail-back:hover { color: var(--gold); }
    .detail-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; margin-bottom: 1.2rem; flex-wrap: wrap; }
    .detail-title { font-family: var(--serif); font-size: clamp(1.5rem, 3vw, 2rem); font-weight: 700; }
    .detail-actions { display: flex; gap: .8rem; }
    .detail-action-btn {
      display: flex; align-items: center; gap: .4rem;
      background: none; border: none; font-size: .85rem; font-weight: 500;
      padding: .4rem .8rem; border-radius: var(--r);
      text-decoration: underline; text-underline-offset: 3px;
      transition: background .15s;
    }
    .detail-action-btn:hover { background: var(--cream); }
    .detail-thumbs { display: grid; grid-template-columns: repeat(4, 1fr); gap: .5rem; margin-bottom: 1.3rem; }
    .detail-thumb { position: relative; height: 82px; overflow: hidden; border-radius: .65rem; border: 0; padding: 0; background: var(--cream-dark); cursor: pointer; }
    .detail-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .detail-thumb-more { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(20,14,11,.55); color: white; font-weight: 700; }
    .detail-specs { display: flex; gap: .45rem; flex-wrap: wrap; margin: 1rem 0 1.5rem; }
    .detail-spec { border: 1px solid var(--border); border-radius: 9999px; padding: .45rem .7rem; font-size: .75rem; background: var(--white); }
    .rating-breakdown { display: grid; gap: .6rem; margin-top: .8rem; }
    .rating-row { display: grid; grid-template-columns: 100px 1fr 28px; gap: .6rem; align-items: center; font-size: .78rem; }
    .rating-track { height: 5px; background: var(--border); border-radius: 9999px; overflow: hidden; }
    .rating-fill { height: 100%; background: var(--espresso); border-radius: inherit; }

    /* ── Photo Mosaic ── */
    .mosaic {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: auto auto;
      gap: .5rem;
      border-radius: var(--r);
      overflow: hidden;
      margin-bottom: 2rem;
      max-height: 480px;
    }
    .mosaic-main { grid-row: 1 / 3; }
    .mosaic img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .mosaic img { cursor: zoom-in; }
    .mosaic-main img { height: 480px; }
    .mosaic-side { display: grid; grid-template-rows: 1fr 1fr; gap: .5rem; }
    .mosaic-side img { height: 234px; }
    .mosaic-more-wrap { position: relative; }
    .mosaic-more-wrap img { height: 234px; }
    .mosaic-more-btn {
      position: absolute; bottom: .9rem; right: .9rem;
      background: var(--white); border: 1.5px solid var(--espresso);
      border-radius: .45rem; padding: .45rem .9rem;
      font-size: .8rem; font-weight: 600;
      display: flex; align-items: center; gap: .4rem;
      transition: background .2s;
    }
    .mosaic-more-btn:hover { background: var(--cream); }

    /* ── Photo Lightbox ── */
    .photo-modal {
      position: fixed; inset: 0; z-index: 1000;
      background: rgba(20, 14, 11, .94);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 1.5rem;
    }
    .photo-modal-close {
      position: fixed; top: clamp(4.5rem, 10vh, 6rem); right: 1.25rem; z-index: 2;
      width: 42px; height: 42px; border: 2px solid white;
      border-radius: 50%; background: white; color: var(--espresso);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 3px 14px rgba(0,0,0,.45);
      cursor: pointer;
    }
    .photo-modal-close:hover { background: var(--cream); }
    .photo-modal-image {
      max-width: min(92vw, 1100px); max-height: 76vh;
      object-fit: contain; border-radius: .4rem;
    }
    .photo-modal-nav {
      position: absolute; top: 50%; transform: translateY(-50%);
      width: 42px; height: 42px; border: none; border-radius: 50%;
      background: white; color: var(--espresso); font-size: 1.5rem; cursor: pointer;
    }
    .photo-modal-prev { left: 1.2rem; }
    .photo-modal-next { right: 1.2rem; }
    .photo-modal-counter { color: white; margin: .8rem 0; font-size: .85rem; }
    .photo-modal-thumbs { display: flex; gap: .5rem; max-width: 92vw; overflow-x: auto; padding: .2rem; }
    .photo-modal-thumb { width: 68px; height: 48px; flex: 0 0 auto; padding: 0; border: 2px solid transparent; border-radius: .25rem; overflow: hidden; background: none; cursor: pointer; }
    .photo-modal-thumb.active { border-color: var(--gold); }
    .photo-modal-thumb img { width: 100%; height: 100%; object-fit: cover; }

    /* ── Escape flow ── */
    .landing-screen { min-height: 100vh; background: var(--cream); padding: 1.5rem 2rem 2rem; display: flex; flex-direction: column; }
    .landing-brand { font-family: var(--serif); font-size: 1.35rem; font-weight: 700; letter-spacing: .08em; }
    .landing-brand span { color: var(--gold); }
    .landing-content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 1.5rem; }
    .landing-collage { position: relative; width: min(76vw, 470px); height: min(58vw, 360px); margin: 1rem 0; }
    .landing-photo { position: absolute; overflow: hidden; border: .45rem solid var(--cream); box-shadow: var(--shadow-md); cursor: pointer; transition: filter .25s, box-shadow .25s, z-index .25s; }
    .landing-photo:hover, .landing-photo.active { filter: saturate(1.15) brightness(1.04); box-shadow: 0 10px 30px rgba(30,18,10,.24); z-index: 4; }
    .landing-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .landing-photo.one { width: 48%; height: 68%; left: 0; top: 14%; border-radius: 48% 48% 10% 48%; transform: rotate(-8deg); }
    .landing-photo.two { width: 42%; height: 76%; left: 29%; top: 2%; border-radius: 48% 48% 48% 10%; transform: rotate(3deg); }
    .landing-photo.three { width: 39%; height: 62%; right: 0; bottom: 0; border-radius: 48% 10% 48% 48%; transform: rotate(8deg); }
    .landing-title { max-width: 650px; font-family: var(--serif); font-size: clamp(2.2rem, 6vw, 4.8rem); line-height: .98; letter-spacing: 0; }
    .landing-subtitle { color: var(--muted); font-size: 1rem; }
    .landing-name { width: min(100%, 280px); padding: .8rem 1rem; border: 1px solid var(--border); border-radius: 9999px; background: var(--white); text-align: center; font: inherit; }
    .landing-cta { background: var(--espresso); color: white; border: none; border-radius: 9999px; padding: .95rem 1.8rem; font: inherit; font-weight: 700; cursor: pointer; }
    .landing-cta:hover { background: var(--espresso-mid); transform: translateY(-1px); }
    .browse-header { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-bottom: 1.25rem; }
    .browse-greeting { font-family: var(--serif); font-size: clamp(1.5rem, 4vw, 2.3rem); }
    .icon-circle { width: 40px; height: 40px; border: 1px solid var(--border); border-radius: 50%; background: var(--white); display: grid; place-items: center; cursor: pointer; }
    .browse-tools { display: flex; gap: .6rem; overflow-x: auto; padding-bottom: .2rem; margin-bottom: 1.8rem; }
    .browse-filter { white-space: nowrap; border: 1px solid var(--border); background: var(--white); border-radius: 9999px; padding: .6rem 1rem; font: inherit; cursor: pointer; }
    .browse-filter:hover { border-color: var(--espresso); }
    .recent-row { display: flex; gap: .8rem; overflow-x: auto; margin: 0 -2rem 2rem; padding: 0 2rem .3rem; scrollbar-width: none; }
    .recent-row::-webkit-scrollbar { display: none; }
    .recent-card { position: relative; flex: 0 0 145px; height: 112px; overflow: hidden; border-radius: 1rem; }
    .recent-card img { width: 100%; height: 100%; object-fit: cover; }
    .recent-card span { position: absolute; left: .5rem; bottom: .5rem; background: white; border-radius: 9999px; padding: .25rem .55rem; font-size: .68rem; font-weight: 700; }
    .browse-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1rem; }
    .browse-grid .card-img { aspect-ratio: 1 / 1.08; }
    .bottom-nav { position: fixed; z-index: 10; bottom: 1rem; left: 50%; transform: translateX(-50%); background: var(--espresso); color: white; border-radius: 9999px; display: flex; gap: .2rem; padding: .45rem; box-shadow: var(--shadow-md); }
    .bottom-nav button { width: 42px; height: 38px; border: none; border-radius: 9999px; color: rgba(255,255,255,.7); background: transparent; display: grid; place-items: center; cursor: pointer; }
    .bottom-nav button.active, .bottom-nav button:hover { background: var(--gold); color: var(--espresso); }
    .filter-modal { position: fixed; inset: 0; z-index: 30; background: rgba(20,14,11,.4); display: grid; place-items: end center; }
    .filter-sheet { width: min(100%, 560px); background: var(--cream); border-radius: 1.5rem 1.5rem 0 0; padding: 1.5rem; box-shadow: var(--shadow-md); }
    .filter-sheet-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
    .filter-sheet h2 { font-family: var(--serif); }
    .filter-options { display: flex; flex-wrap: wrap; gap: .6rem; margin: .8rem 0 1.4rem; }
    .filter-option { border: 1px solid var(--border); background: white; border-radius: 9999px; padding: .55rem .9rem; cursor: pointer; }
    .filter-option.active { background: var(--espresso); color: white; border-color: var(--espresso); }
    .filter-range { width: 100%; accent-color: var(--espresso); }
    .range-labels { display: flex; justify-content: space-between; font-size: .8rem; color: var(--muted); }
    .detail-bottom-bar { position: fixed; z-index: 12; left: 50%; bottom: 1rem; transform: translateX(-50%); width: min(92vw, 720px); display: flex; align-items: center; justify-content: space-between; gap: 1rem; background: var(--white); border: 1px solid var(--border); border-radius: 9999px; padding: .65rem .7rem .65rem 1.2rem; box-shadow: var(--shadow-md); }
    .detail-bottom-bar strong, .detail-bottom-bar small { display: block; }
    .detail-bottom-bar small { color: var(--muted); font-size: .72rem; }
    .booking-reminder { position: fixed; right: 1rem; bottom: 1rem; z-index: 40; width: min(90vw, 360px); background: var(--white); border: 1px solid var(--border); border-radius: 1rem; padding: 1rem; box-shadow: var(--shadow-lg); }
    .booking-reminder strong { display: block; margin-bottom: .25rem; }

    /* ── Detail Body ── */
    .detail-body {
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 3.5rem;
      align-items: start;
    }
    @media (max-width: 860px) {
      .detail-body { grid-template-columns: 1fr; }
      .booking-sticky { position: static !important; }
    }

    .detail-meta { font-size: 1rem; color: var(--muted); margin-bottom: 1.2rem; }
    .detail-badges {
      display: flex; gap: .8rem; flex-wrap: wrap;
      margin-bottom: 1.5rem;
    }
    .detail-badge {
      display: flex; align-items: center; gap: .5rem;
      border: 1.5px solid var(--border); border-radius: var(--r);
      padding: .65rem 1rem; font-size: .82rem;
    }
    .detail-badge-icon { font-size: 1.3rem; }
    .detail-badge-text strong { display: block; font-size: .82rem; }
    .detail-badge-text span { font-size: .75rem; color: var(--muted); }

    .divider { border: none; border-top: 1px solid var(--border); margin: 1.5rem 0; }

    .host-row { display: flex; align-items: center; gap: 1rem; margin-bottom: 1.5rem; }
    .host-avatar {
      width: 48px; height: 48px; border-radius: 50%;
      background: var(--espresso);
      display: flex; align-items: center; justify-content: center;
      font-family: var(--serif); font-size: 1.2rem; color: white; font-weight: 700;
      flex-shrink: 0;
    }
    .host-info strong { font-size: .95rem; display: block; }
    .host-info span { font-size: .8rem; color: var(--muted); }

    .detail-desc { font-size: .95rem; line-height: 1.75; color: var(--espresso-mid); }

    .amenities-grid-detail {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 1rem; margin-top: 1rem;
    }
    .amenity-row { display: flex; align-items: center; gap: .75rem; font-size: .9rem; }

    .rules-list { list-style: none; display: flex; flex-direction: column; gap: .6rem; margin-top: .8rem; }
    .rules-list li { display: flex; align-items: center; gap: .6rem; font-size: .9rem; color: var(--espresso-mid); }

      position: sticky;
      top: 90px;
    }

      background: var(--white);
      border: 1.5px solid var(--border);
      border-radius: var(--r);
      padding: 1.6rem;
      box-shadow: var(--shadow-md);
    }
    .booking-price { font-size: 1.3rem; font-weight: 700; margin-bottom: 1.2rem; }
    .booking-price span { font-size: .9rem; font-weight: 400; color: var(--muted); }
    .date-row {
      display: grid; grid-template-columns: 1fr 1fr;
      border: 1.5px solid var(--border); border-radius: var(--r);
      overflow: visible; margin-bottom: .8rem;
    }
    .date-field {
      width: 100%;
      min-width: 0;
      padding: .7rem .9rem;
      border: none; outline: none;
      font-family: inherit; font-size: .82rem;
      background: var(--white);
      cursor: pointer;
    }
    .date-field:first-child { border-right: 1px solid var(--border); }
    .date-field:focus { background: var(--cream); }
    .date-label { font-size: .68rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; display: block; margin-bottom: .2rem; }
    .calendar-field { position: relative; padding: .7rem .9rem; min-width: 0; }
    .calendar-value { width: 100%; border: none; background: transparent; color: var(--espresso); text-align: left; font: inherit; cursor: pointer; }
    .calendar-value.empty { color: var(--muted); }
    .calendar-popover { position: absolute; z-index: 60; top: calc(100% + .4rem); left: 0; width: min(260px, calc(100vw - 2rem)); padding: .8rem; background: var(--white); border: 1px solid var(--border); border-radius: .8rem; box-shadow: var(--shadow-lg); }

    .calendar-week { color: var(--muted); font-size: .65rem; margin-bottom: .2rem; }

      width: 100%; padding: .75rem .9rem;

      background: var(--white); cursor: pointer;
      margin-bottom: 1rem; appearance: none;

    .name-field {
      width: 100%; padding: .75rem .9rem;

    /* ══════════════════════════════════════════
       FOOTER
    ══════════════════════════════════════════ */

      background: var(--espresso); color: rgba(255,255,255,.75);

    }

    .footer-sub { font-size: .78rem; letter-spacing: .18em; text-transform: uppercase; color: var(--gold); margin-bottom: 1.8rem; }
    .footer-links { display: flex; flex-wrap: wrap; justify-content: center; gap: 1.2rem; margin-bottom: 1.5rem; }
    .footer-links a {

      display: flex; align-items: center; gap: .4rem;
      transition: color .2s;

    .footer-links a:hover { color: var(--gold); }
    .footer-socials { display: flex; justify-content: center; gap: 1rem; margin-bottom: 1.8rem; }
    .footer-socials a {
      width: 38px; height: 38px; border-radius: 50%;
      border: 1.5px solid rgba(255,255,255,.2);
      display: flex; align-items: center; justify-content: center;
      transition: border-color .2s, background .2s;
    }
    .footer-socials a:hover { background: var(--gold); border-color: var(--gold); }
    .footer-socials svg { width: 17px; height: 17px; fill: white; }
    .footer-copy { font-size: .75rem; opacity: .4; }

    /* ══════════════════════════════════════════
       RESPONSIVE
    ══════════════════════════════════════════ */
    @media (max-width: 680px) {
      .home-wrap { padding: 1.2rem; }

      .filter-bar { padding: .6rem 1.2rem; }
      .mosaic { grid-template-columns: 1fr; max-height: none; }
      .mosaic-main img { height: 260px; }
      .mosaic-side { display: none; }
      .date-row { grid-template-columns: 1fr; }
      .date-row > div { border-right: 0 !important; border-bottom: 1px solid var(--border); }
      .date-row > div:last-child { border-bottom: 0; }
      .calendar-popover { left: auto; right: 0; }
      .amenities-grid-detail { grid-template-columns: 1fr; }
      .photo-modal-close { top: 4.75rem; right: 1rem; }
      .landing-screen { padding: 1.2rem; }
      .recent-row { margin-left: -1.2rem; margin-right: -1.2rem; padding-left: 1.2rem; padding-right: 1.2rem; }
      .browse-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .8rem; }
      .bottom-nav { bottom: .65rem; }
      .detail-bottom-bar { bottom: .65rem; }
    }

    /* ══════════════════════════════════════════
       UTILITY
    ══════════════════════════════════════════ */
    .fade-in { animation: fadeIn .3s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

function HomeView({ onSelect, search, filter, properties, onOpenFilters, type, priceMax, ratingMin, reviewsMin, onNavChange, browseNav, favorites, favoriteOnly, userName, onNotifications, onToggleFavorite }) {
  const searchTerm = search.trim().toLowerCase();
  const filtered = properties.filter(prop => {
    const matchesLocation = filter === 'All locations' || prop.location.startsWith(`${filter},`) || prop.location === filter;
    const matchesPrice = prop.pricePerNight <= priceMax;
    const matchesType = type === 'All types' || prop.type.toLowerCase().includes(type.toLowerCase());
    const matchesRating = prop.rating >= ratingMin;
    const matchesReviews = prop.reviews >= reviewsMin;
    const matchesFavorite = !favoriteOnly || favorites.includes(prop.id);
    const matchesSearch = !searchTerm || [prop.name, prop.location, prop.description]
      .some(value => value.toLowerCase().includes(searchTerm));
    return matchesLocation && matchesPrice && matchesType && matchesRating && matchesReviews && matchesSearch && matchesFavorite;
  });
  return h('div', { className: 'home-wrap fade-in' },
    h('div', { className: 'browse-header' },

const dateKey = date => `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
function CalendarPicker({ label, value, onChange, bookedDates, minDate }) {
  const [open, setOpen] = useState(false);
  const [month, setMonth] = useState(() => {
    const initial = value ? new Date(`${value}T12:00:00`) : new Date();
    return new Date(initial.getFullYear(), initial.getMonth(), 1);
  });
  const today = dateKey(new Date());
  const monthName = month.toLocaleString('en', { month: 'long', year: 'numeric' });
  const firstDay = new Date(month.getFullYear(), month.getMonth(), 1).getDay();
  const daysInMonth = new Date(month.getFullYear(), month.getMonth() + 1, 0).getDate();
  const cells = [...Array(firstDay).fill(null), ...Array.from({ length: daysInMonth }, (_, index) => index + 1)];
  const chooseDate = day => {
    const selected = new Date(month.getFullYear(), month.getMonth(), day);
    const key = dateKey(selected);
    if (!bookedDates.includes(key) && key >= (minDate || today)) { onChange(key); setOpen(false); }
  };
  return h('div', { className: 'calendar-field' },
    h('label', { className: 'date-label' }, label),
    h('button', { className: `calendar-value${value ? '' : ' empty'}`, onClick: () => setOpen(!open), type: 'button' }, value || 'Select date'),
    open && h('div', { className: 'calendar-popover' },
      h('div', { className: 'calendar-head' },
        h('button', { type: 'button', onClick: () => setMonth(new Date(month.getFullYear(), month.getMonth() - 1, 1)), 'aria-label': 'Previous month' }, '‹'),
        h('span', null, monthName),
        h('button', { type: 'button', onClick: () => setMonth(new Date(month.getFullYear(), month.getMonth() + 1, 1)), 'aria-label': 'Next month' }, '›')
      ),
      h('div', { className: 'calendar-week' }, ['Su','Mo','Tu','We','Th','Fr','Sa'].map(day => h('span', { key: day }, day))),
      h('div', { className: 'calendar-grid' }, cells.map((day, index) => {
        if (!day) return h('span', { key: `empty-${index}` });
        const key = dateKey(new Date(month.getFullYear(), month.getMonth(), day));
        const disabled = bookedDates.includes(key) || key < (minDate || today);
        return h('button', { key, type: 'button', className: `calendar-day${value === key ? ' selected' : ''}`, disabled, onClick: () => chooseDate(day), title: bookedDates.includes(key) ? 'Already booked' : undefined }, day);
      }))
    )
  );
}

  const [checkIn, setCheckIn]   = useState('');

  const [guests, setGuests]     = useState(1);
  const [name, setName]         = useState('');
  const [activeImage, setActiveImage] = useState(null);

  useEffect(() => {
    if (activeImage === null) return undefined;
    const handleKeyDown = event => {
      if (event.key === 'Escape') setActiveImage(null);
      if (event.key === 'ArrowLeft') setActiveImage(index => (index - 1 + prop.images.length) % prop.images.length);
      if (event.key === 'ArrowRight') setActiveImage(index => (index + 1) % prop.images.length);
    };
    document.addEventListener('keydown', handleKeyDown);
    return () => document.removeEventListener('keydown', handleKeyDown);
  }, [activeImage, prop.images.length]);

  // Calculate nights + total
  const nights = checkIn && checkOut
    ? Math.max(0, Math.round((new Date(checkOut) - new Date(checkIn)) / 86400000))
    : 0;
  const total = nights * prop.pricePerNight;
  const hasBookedDateInRange = checkIn && checkOut && prop.bookedDates.some(bookedDate => bookedDate >= checkIn && bookedDate < checkOut);

  const handleBook = () => {
    if (!name || !checkIn || !checkOut) { alert('Please fill in your name and dates.'); return; }
    if (hasBookedDateInRange || prop.bookedDates.includes(checkIn) || prop.bookedDates.includes(checkOut)) { alert('One or more selected dates are already booked. Please choose different dates.'); return; }

        h('div', { className: 'booking-card', id: 'reserve-form' },
          h('p', { className: 'booking-price' },
            `KSh ${prop.pricePerNight.toLocaleString()}`, h('span', null, ' / night')
          ),

          // Name
          h('label', { style: { fontSize: '.72rem', fontWeight: 700, letterSpacing: '.08em', textTransform: 'uppercase', display: 'block', marginBottom: '.4rem' } }, 'Your Name'),
          h('input', {
            type: 'text', className: 'name-field',
            placeholder: 'e.g. Nelly Arunga',
            value: name || userName, onChange: e => setName(e.target.value)
          }),

          // Dates
          h('div', { style: { fontSize: '.72rem', fontWeight: 700, letterSpacing: '.08em', textTransform: 'uppercase', marginBottom: '.4rem' } }, 'Dates'),
          h('div', { className: 'date-row' },
            h(CalendarPicker, { label: 'Check-in', value: checkIn, onChange: value => { setCheckIn(value); if (checkOut && value >= checkOut) setCheckOut(''); }, bookedDates: prop.bookedDates }),
            h(CalendarPicker, { label: 'Check-out', value: checkOut, onChange: setCheckOut, bookedDates: prop.bookedDates, minDate: checkIn || undefined })
          ),

          // Guests
          h('label', { style: { fontSize: '.72rem', fontWeight: 700, letterSpacing: '.08em', textTransform: 'uppercase', display: 'block', margin: '.8rem 0 .4rem' } }, 'Guests'),
          h('select', { className: 'guests-field', value: guests, onChange: e => setGuests(Number(e.target.value)) },
            [...Array(prop.guests)].map((_, i) => h('option', { key: i+1, value: i+1 }, `${i+1} guest${i+1 > 1 ? 's' : ''}`))
          ),

          // WhatsApp button
          h('button', { className: 'wa-btn', onClick: handleBook },
            h(IconWA), 'Reserve via WhatsApp'
          ),
          h('p', { className: 'booking-note' }, 'You won\'t be charged yet — we\'ll confirm via WhatsApp first.'),

          // Price breakdown
          nights > 0 && h('div', { className: 'booking-breakdown' },
            h('div', { className: 'booking-breakdown-row' },
              h('span', null, `KSh ${prop.pricePerNight.toLocaleString()} × ${nights} night${nights > 1 ? 's' : ''}`),
              h('span', null, `KSh ${total.toLocaleString()}`)
            ),
            h('div', { className: 'booking-breakdown-row' },
              h('span', null, 'Service fee'),
              h('span', null, 'KSh 0')
            ),
            h('div', { className: 'booking-breakdown-row total' },
              h('span', null, 'Total'),
              h('span', null, `KSh ${total.toLocaleString()}`)
            )
          )
        )
      )
    ),
    h(DetailBottomBar, { prop, onBook }),
    activeImage !== null && h('div', { className: 'photo-modal', role: 'dialog', 'aria-modal': 'true', 'aria-label': `${prop.name} photo gallery`, onClick: () => setActiveImage(null) },
      h('button', { className: 'photo-modal-close', onClick: () => setActiveImage(null), 'aria-label': 'Close photos', title: 'Close photos' }, h(IconClose)),
      prop.images.length > 1 && h('button', { className: 'photo-modal-nav photo-modal-prev', onClick: event => { event.stopPropagation(); setActiveImage(index => (index - 1 + prop.images.length) % prop.images.length); }, 'aria-label': 'Previous photo' }, '‹'),
      h('img', { className: 'photo-modal-image', src: prop.images[activeImage], alt: `${prop.name} photo ${activeImage + 1}`, onClick: event => event.stopPropagation() }),
      prop.images.length > 1 && h('button', { className: 'photo-modal-nav photo-modal-next', onClick: event => { event.stopPropagation(); setActiveImage(index => (index + 1) % prop.images.length); }, 'aria-label': 'Next photo' }, '›'),
      h('div', { className: 'photo-modal-counter' }, `${activeImage + 1} / ${prop.images.length}`),
      h('div', { className: 'photo-modal-thumbs', onClick: event => event.stopPropagation() },
        prop.images.map((image, index) => h('button', { key: image + index, className: `photo-modal-thumb${activeImage === index ? ' active' : ''}`, onClick: () => setActiveImage(index), 'aria-label': `View photo ${index + 1}` }, h('img', { src: image, alt: '' })))
      )
    )
  );
}

/* ────────────────────────────────────────────
   APP (router)
──────────────────────────────────────────── */
function normalizeProperty(property, index) {
  const numericPrice = Number(String(property.pricePerNight ?? property.price ?? '').replace(/[^0-9.]/g, '')) || 0;
  return {
    ...property,
    id: property.id ?? index + 1,
    type: property.type ?? 'Home',
    guests: property.guests ?? 2,
    bedrooms: property.bedrooms ?? 1,
    beds: property.beds ?? 1,
    baths: property.baths ?? 1,
    pricePerNight: numericPrice,
    rating: property.rating ?? 0,
    reviews: property.reviews ?? 0,
    badge: property.badge ?? 'Featured home',
    host: property.host ?? { name: 'Kahawa Homes', months: 0 },
    images: Array.isArray(property.images) ? property.images : [],
    bookedDates: Array.isArray(property.bookedDates) ? property.bookedDates : [],
    amenities: Array.isArray(property.amenities) ? property.amenities : [],
    rules: Array.isArray(property.rules) ? property.rules : [],
    description: property.description ?? '',
  };
}

function App() {
  const [currentScreen, setCurrentScreen] = useState('landing');
  const [userName, setUserName] = useState(() => localStorage.getItem('kahawa-user-name') || '');
  const [selected, setSelected] = useState(null);
  const [search, setSearch]     = useState('');
  const [filter, setFilter]     = useState('All locations');
  const [type, setType]           = useState('All types');
  const [priceMax, setPriceMax]   = useState(30000);
  const [ratingMin, setRatingMin] = useState(0);
  const [reviewsMin, setReviewsMin] = useState(0);
  const [filterOpen, setFilterOpen] = useState(false);
  const [browseNav, setBrowseNav] = useState(0);
  const [favorites, setFavorites] = useState(() => JSON.parse(localStorage.getItem('kahawa-favorites') || '[]'));
  const [favoriteOnly, setFavoriteOnly] = useState(false);
  const [booking, setBooking] = useState(() => JSON.parse(localStorage.getItem('kahawa-booking') || 'null'));
  const [notificationOpen, setNotificationOpen] = useState(false);
  const [profileOpen, setProfileOpen] = useState(false);
  const [properties, setProperties] = useState([]);
  const [propertiesLoading, setPropertiesLoading] = useState(true);
  const [propertiesError, setPropertiesError] = useState('');

  useEffect(() => {
    const dataVersion = Date.now();
    const loadProperties = (url) => fetch(`${url}?v=${dataVersion}`, { cache: 'no-store' }).then(response => {
      if (!response.ok) throw new Error(`Could not load ${url} (${response.status})`);
      return response.json();
    });

    const localDataUrl = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
      ? 'properties.json'
      : 'https://raw.githubusercontent.com/stacy-ao/kahawa-homes/main/properties.json';
    loadProperties(localDataUrl)
      .then(response => {
        const data = response;
        const loadedProperties = Array.isArray(data) ? data : data.properties;
        if (!Array.isArray(loadedProperties)) throw new Error('properties.json must contain an array of properties');
        setProperties(loadedProperties.map(normalizeProperty));
        setPropertiesLoading(false);
      })
      .catch(error => {
        console.error(error);
        setPropertiesLoading(false);
        setPropertiesError('Property data could not be loaded.');
      });
  }, []);

  const goHome = () => {
    setSelected(null);
    setCurrentScreen('browse');
    setSearch('');
    setFilter('All locations');
    setType('All types');
    setPriceMax(30000);
    setRatingMin(0);
    setReviewsMin(0);
    setFavoriteOnly(false);
    setBrowseNav(0);
    window.scrollTo(0,0);
  };
  const goDetail = (p) => { setSelected(p); setCurrentScreen('detail'); window.scrollTo(0,0); };
  const locations = ['All locations', ...new Set(properties.map(prop => prop.location.split(',')[0].trim()))];
  const saveUserName = name => { setUserName(name); localStorage.setItem('kahawa-user-name', name); };
  const toggleFavorite = id => setFavorites(current => {
    const next = current.includes(id) ? current.filter(item => item !== id) : [...current, id];
    localStorage.setItem('kahawa-favorites', JSON.stringify(next));
    return next;
  });
  const handleBooking = nextBooking => {
    setBooking(nextBooking);
    localStorage.setItem('kahawa-booking', JSON.stringify(nextBooking));
    setNotificationOpen(true);
    if ('Notification' in window && Notification.permission === 'granted') new Notification('Kahawa Homes booking saved', { body: `${nextBooking.property} is booked for ${nextBooking.checkIn}.` });
  };
  const handleBrowseNav = index => {
    setBrowseNav(index);
    if (index === 0) { setFavoriteOnly(false); goHome(); }
    if (index === 1) { setFavoriteOnly(true); setCurrentScreen('browse'); setSelected(null); }
    if (index === 2) setProfileOpen(true);
    if (index === 3 && navigator.share) navigator.share({ title: 'Kahawa Homes', url: window.location.href });
  };
  const enableNotifications = () => { if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission(); setNotificationOpen(true); };
  const scrollToReserve = () => document.getElementById('reserve-form')?.scrollIntoView({ behavior: 'smooth', block: 'center' });

  useEffect(() => {
    if (!booking?.checkIn) return undefined;
    const reminderTime = new Date(`${booking.checkIn}T09:00:00`).getTime() - 86400000;
    const delay = Math.max(0, reminderTime - Date.now());
    const timer = setTimeout(() => {
      setNotificationOpen(true);
      if ('Notification' in window && Notification.permission === 'granted') new Notification('Kahawa Homes reminder', { body: `${booking.property} is almost here, on ${booking.checkIn}.` });
    }, delay);
    return () => clearTimeout(timer);
  }, [booking]);

  return h(React.Fragment, null,
    currentScreen === 'landing'
      ? h('div', { className: 'site-shell' }, h(LandingView, { onExplore: () => setCurrentScreen('browse'), properties, userName, onNameChange: saveUserName }))
      : h('div', { className: 'site-shell' },
        h(Nav, { onLogoClick: goHome, search, onSearch: setSearch, onProfile: () => setProfileOpen(true) }),
        propertiesError && h('p', { className: 'load-error', role: 'alert' }, propertiesError),
        propertiesLoading && h('p', { className: 'load-error' }, 'Loading current properties...'),
        currentScreen === 'detail' && selected
          ? h(DetailView, { prop: selected, userName, onBack: goHome, onBooking: handleBooking, onBook: scrollToReserve })
          : !propertiesLoading && h(HomeView, { onSelect: goDetail, search, filter, properties, onOpenFilters: () => setFilterOpen(true), type, priceMax, ratingMin, reviewsMin, onNavChange: handleBrowseNav, browseNav, favorites, favoriteOnly, userName, onNotifications: enableNotifications, onToggleFavorite: toggleFavorite }),
        currentScreen !== 'detail' && h(Footer, null),
        filterOpen && h(FilterModal, { onClose: () => setFilterOpen(false), priceMax, onPriceChange: setPriceMax, type, onTypeChange: setType, filter, locations, onLocationChange: setFilter, ratingMin, onRatingChange: setRatingMin, reviewsMin, onReviewsChange: setReviewsMin }),
        profileOpen && h(ProfileModal, { userName, onSave: saveUserName, onClose: () => setProfileOpen(false) }),
        h(BookingReminder, { booking: notificationOpen ? booking : null, onClose: () => setNotificationOpen(false) })
      )
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App, null));
</script>
